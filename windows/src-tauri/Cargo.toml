[package]
name = "ambient"
description = "Ambient for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ambient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ambient-contracts.workspace = true
ambient-agent = { path = "../crates/ambient-agent" }
ambient-background = { path = "../crates/ambient-background" }
ambient-connectors = { path = "../crates/ambient-connectors" }
ambient-memory = { path = "../crates/ambient-memory" }
ambient-platform = { path = "../crates/ambient-platform" }
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
reqwest.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
