# Builds the Windows installer from a release's tag and uploads it, its update signature and the Tauri update feed
# (latest.json) to that GitHub release, next to the Mac's Ambient-macos.dmg and appcast.xml. Run by hand with the tag.
# The release may still be a draft: publish it only once both the Mac and the Windows files are on it, so publik never
# scans a half-filled release.
name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to attach the Windows installer to (for example v0.1.9)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the installer, signed for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PUBLIK_UPDATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PUBLIK_UPDATE_KEY_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build

      - name: Check it with Microsoft Defender
        run: ./ci/scan.ps1 -Paths "target\release\ambient.exe","target\release\bundle\nsis\*.exe" -EvidenceDirectory "${{ runner.temp }}\evidence"

      - name: Write the update feed and upload everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) { throw "The tag $env:RELEASE_TAG does not match the app's version $version" }
          $installer = Get-Item "target\release\bundle\nsis\Ambient_${version}_x64-setup.exe"
          $signature = Get-Content "$($installer.FullName).sig" -Raw
          $feed = [ordered]@{
            version = $version
            notes = "Ambient $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature.Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$($installer.Name)"
              }
            }
          }
          $feedPath = Join-Path $env:RUNNER_TEMP "latest.json"
          [IO.File]::WriteAllText($feedPath, ($feed | ConvertTo-Json -Depth 5))
          Get-Content $feedPath
          gh release upload $env:RELEASE_TAG $installer.FullName "$($installer.FullName).sig" $feedPath --clobber
